name: CELESTE macOS Universal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['vst3/**', '.github/workflows/celeste-macos.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vst3/.mac-deps
            vst3/.mac-build
          key: macos15-juce8012-${{ hashFiles('vst3/*.cpp', 'vst3/*.h', 'vst3/CMakeLists.txt') }}
          restore-keys: macos15-juce8012-
      - name: Build Universal VST3 and AU and test DSP
        run: bash vst3/build-macos.command
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test real VST3 on the runner architecture
        run: |
          python -m pip install numpy==2.2.6 pedalboard==0.9.25
          for attempt in {1..10}; do
            python vst3/host_test.py 'vst3/mac-release/CELESTE Parallel.vst3'
          done | tee vst3/mac-release/host-tests.txt
      - name: Validate Audio Unit
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto 'vst3/mac-release/CELESTE Parallel.component' "$HOME/Library/Audio/Plug-Ins/Components/CELESTE Parallel.component"
          killall -u "$USER" AudioComponentRegistrar || true
          sleep 3
          auval -a
          auval -v aufx Cpf1 Clst | tee vst3/mac-release/au-validation.txt
      - name: Archive binaries and validation logs
        run: ditto -c -k --sequesterRsrc --keepParent vst3/mac-release CELESTE-Parallel-macOS-Universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CELESTE-Parallel-macOS-Universal
          path: CELESTE-Parallel-macOS-Universal.zip
          if-no-files-found: error
  test-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CELESTE-Parallel-macOS-Universal
      - run: ditto -x -k CELESTE-Parallel-macOS-Universal.zip .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test VST3 and AU on Intel
        run: |
          python -m pip install numpy==2.2.6 pedalboard==0.9.25
          python vst3/host_test.py 'mac-release/CELESTE Parallel.vst3'
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto 'mac-release/CELESTE Parallel.component' "$HOME/Library/Audio/Plug-Ins/Components/CELESTE Parallel.component"
          killall -u "$USER" AudioComponentRegistrar || true
          sleep 3
          auval -v aufx Cpf1 Clst
